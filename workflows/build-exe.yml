name: Compilar EXE (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      con_ia:
        description: "Incluir la IA que separa la voz (pesa mucho más)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CON_IA: ${{ github.event.inputs.con_ia || 'true' }}

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soundfile pedalboard imageio-ffmpeg pyinstaller
          if [ "$CON_IA" = "true" ]; then pip install "audio-separator[cpu]"; fi

      - name: Compilar VozLimpia.exe
        shell: bash
        working-directory: desktop
        run: |
          EXTRA=""
          if [ "$CON_IA" = "true" ]; then
            EXTRA="--collect-all audio_separator --collect-all onnxruntime --collect-all librosa"
          fi
          pyinstaller --noconfirm --clean --windowed --name VozLimpia \
            --collect-all imageio_ffmpeg --collect-all pedalboard --collect-all soundfile \
            $EXTRA vozlimpia_gui.py

      - name: Comprimir (carpeta con VozLimpia.exe)
        shell: bash
        run: 7z a -tzip VozLimpia-Windows.zip ./desktop/dist/VozLimpia/*

      - uses: actions/upload-artifact@v4
        with:
          name: VozLimpia-EXE
          path: VozLimpia-Windows.zip

      - name: Publicar en Releases (solo con etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VozLimpia-Windows.zip
