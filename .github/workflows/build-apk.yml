name: Compilar APK (Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copiar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VozLimpia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VozLimpia-APK
          path: VozLimpia.apk

      - name: Publicar en Releases (solo con etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VozLimpia.apk
